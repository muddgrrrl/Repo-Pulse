name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m compileall -q repo_pulse.py tests
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m venv /tmp/repo-pulse-lint
      - run: /tmp/repo-pulse-lint/bin/python -m pip install 'ruff==0.17.6'
      - run: /tmp/repo-pulse-lint/bin/ruff check .
      - run: /tmp/repo-pulse-lint/bin/ruff format --check .
